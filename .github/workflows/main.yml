name: 'Lint Code'

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Linter
        run: |
          echo "Running flake8 on all Python files..."
          # Exclude hidden dirs, venv, __pycache__, etc.
          find . -name "*.py" \
            -not -path "./.*" \
            -not -path "*/venv/*" \
            -not -path "*/env/*" \
            -not -path "*/.venv/*" \
            -not -path "*/__pycache__/*" \
            -print0 | xargs -0 flake8
          echo "Python linting completed."

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install JSHint (consider switching to ESLint)
        run: npm install -g jshint

      - name: Run Linter
        run: |
          echo "Running JSHint on all JavaScript files..."
          # Exclude node_modules, hidden dirs
          find . -name "*.js" \
            -not -path "./.*" \
            -not -path "*/node_modules/*" \
            -print0 | xargs -0 jshint
          echo "JavaScript linting completed."

