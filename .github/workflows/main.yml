name: 'Lint Code'

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Linter
        run: |
          echo "Running flake8 on all Python files..."
          # flake8 handles recursion natively – no need for find/xargs
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude .git,__pycache__,venv,.venv,env,.tox,dist,build
          # If the above is too strict, uncomment this line instead:
          # flake8 . --max-line-length=127 --exclude .git,__pycache__,venv,.venv,env
          echo "Python linting completed."

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install JSHint
        run: npm install -g jshint

      - name: Run Linter
        run: |
          echo "Running JSHint on all JavaScript files..."
          # -exec {} + handles large file lists safely and avoids xargs pitfalls
          find . -name "*.js" -not -path "./.*" -not -path "*/node_modules/*" -exec jshint {} +
          echo "JavaScript linting completed."
