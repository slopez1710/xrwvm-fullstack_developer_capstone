name: 'Lint Code'

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Linter
        run: |
          echo "Running flake8 on all Python files..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude .git,__pycache__,venv,.venv,env,.tox,dist,build
          # If you want more lenient rules, you can change to:
          # flake8 . --max-line-length=127 --exclude .git,__pycache__,venv,.venv,env
          echo "Python linting completed."

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install ESLint
        run: npm install -g eslint

      - name: Create ESLint config (if not present)
        run: |
          if [ ! -f .eslintrc.json ]; then
            echo '{
              "env": {
                "es6": true,
                "node": true,
                "browser": true
              },
              "extends": "eslint:recommended",
              "parserOptions": {
                "ecmaVersion": 2018
              },
              "rules": {
                "indent": ["warn", 2],
                "quotes": ["warn", "single"],
                "semi": ["warn", "always"],
                "no-unused-vars": "warn",
                "no-console": "off"
              }
            }' > .eslintrc.json
            echo "Created default .eslintrc.json"
          else
            echo "Using existing .eslintrc.json"
          fi

      - name: Run Linter
        run: |
          echo "Running ESLint on all JavaScript files..."
          eslint . --ext .js --ignore-pattern "node_modules/*" || true
          echo "JavaScript linting completed."
